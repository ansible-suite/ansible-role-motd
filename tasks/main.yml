---
- name: Skip MOTD on non-Debian systems
  ansible.builtin.debug:
    msg: >-
      Skipping ansible-suite.motd on {{ ansible_facts['distribution'] }}
      (os_family {{ ansible_facts['os_family'] }}); only Debian family is supported.
  when: ansible_facts['os_family'] != 'Debian'

- name: End play for host when not Debian family
  ansible.builtin.meta: end_host
  when: ansible_facts['os_family'] != 'Debian'

- name: Install needrestart
  ansible.builtin.apt:
    name: needrestart
    state: present

- name: Install iucode-tool (microcode check, Intel bare metal only)
  ansible.builtin.apt:
    name: iucode-tool
    state: present
  when:
    - ansible_facts['processor'] | select('search', 'GenuineIntel') | list | length > 0
    - ansible_facts['virtualization_role'] | default('host') != 'guest'

- name: Install figlet
  ansible.builtin.apt:
    name: figlet
    state: present
  when: motd_banner_enabled | bool

- name: Deploy MOTD banner
  ansible.builtin.template:
    src: 05-banner.j2
    dest: /etc/update-motd.d/05-banner
    owner: root
    group: root
    mode: "0755"
  when: motd_banner_enabled | bool

- name: Remove MOTD banner when disabled
  ansible.builtin.file:
    path: /etc/update-motd.d/05-banner
    state: absent
  when: not (motd_banner_enabled | bool)

- name: Install distro-info-data
  ansible.builtin.apt:
    name: distro-info-data
    state: present
  when: motd_eol_enabled | bool

- name: Deploy MOTD EOL info
  ansible.builtin.template:
    src: 10-eol.j2
    dest: /etc/update-motd.d/10-eol
    owner: root
    group: root
    mode: "0755"
  when: motd_eol_enabled | bool

- name: Remove MOTD EOL info when disabled
  ansible.builtin.file:
    path: /etc/update-motd.d/10-eol
    state: absent
  when: not (motd_eol_enabled | bool)

- name: Deploy needrestart cache script
  ansible.builtin.template:
    src: needrestart-cache.sh.j2
    dest: "{{ motd_needrestart_cache_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Refresh needrestart cache

- name: Deploy MOTD needrestart script
  ansible.builtin.template:
    src: 99-needrestart.j2
    dest: /etc/update-motd.d/99-needrestart
    owner: root
    group: root
    mode: "0755"

- name: Schedule periodic cache refresh
  ansible.builtin.cron:
    name: needrestart motd cache
    cron_file: needrestart-motd
    user: root
    minute: "{{ motd_needrestart_cron_minute }}"
    job: "{{ motd_needrestart_cache_script }}"

- name: Schedule cache refresh at boot
  ansible.builtin.cron:
    name: needrestart motd cache at boot
    cron_file: needrestart-motd
    user: root
    special_time: reboot
    job: "{{ motd_needrestart_cache_script }}"

- name: Create cache if missing
  ansible.builtin.command: "{{ motd_needrestart_cache_script }}"
  args:
    creates: "{{ motd_needrestart_cache_file }}"

# ------------------------------
# Pending package updates
# ------------------------------

- name: Deploy updates cache script
  ansible.builtin.template:
    src: updates-cache.sh.j2
    dest: "{{ motd_updates_cache_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Refresh updates cache
  when: motd_updates_enabled | bool

- name: Deploy MOTD updates script
  ansible.builtin.template:
    src: 98-updates.j2
    dest: /etc/update-motd.d/98-updates
    owner: root
    group: root
    mode: "0755"
  when: motd_updates_enabled | bool

- name: Deploy apt hook refreshing the updates cache
  ansible.builtin.template:
    src: apt-motd-updates.conf.j2
    dest: /etc/apt/apt.conf.d/99motd-updates
    owner: root
    group: root
    mode: "0644"
  when: motd_updates_enabled | bool

- name: Schedule periodic updates cache refresh
  ansible.builtin.cron:
    name: updates motd cache
    cron_file: updates-motd
    user: root
    minute: "{{ motd_updates_cron_minute }}"
    job: "{{ motd_updates_cache_script }}"
  when: motd_updates_enabled | bool

- name: Schedule updates cache refresh at boot
  ansible.builtin.cron:
    name: updates motd cache at boot
    cron_file: updates-motd
    user: root
    special_time: reboot
    job: "{{ motd_updates_cache_script }}"
  when: motd_updates_enabled | bool

- name: Create updates cache if missing
  ansible.builtin.command: "{{ motd_updates_cache_script }}"
  args:
    creates: "{{ motd_updates_cache_file }}"
  when: motd_updates_enabled | bool

- name: Remove updates MOTD files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/update-motd.d/98-updates
    - /etc/apt/apt.conf.d/99motd-updates
    - /etc/cron.d/updates-motd
    - "{{ motd_updates_cache_script }}"
    - "{{ motd_updates_cache_file }}"
  when: not (motd_updates_enabled | bool)

- name: Empty static /etc/motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: ""
    owner: root
    group: root
    mode: "0644"
